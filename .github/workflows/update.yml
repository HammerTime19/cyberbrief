name: Update Intel60

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes (GitHub may delay runs a few minutes)
  workflow_dispatch:          # "Run workflow" button in the Actions tab, or the external timer
    inputs:
      source:
        description: "Set to 'timer' by the external 30-minute trigger"
        required: false
        default: manual
  push:
    branches: [main]
    paths: ["docs/**", "pipeline/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write
  models: read      # free AI summaries through GitHub Models
  actions: read     # lets the health job see whether the previous run failed

concurrency:
  group: intel60
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest cards, even if this run waited in the queue behind another one

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Fetch and summarize news
        run: python pipeline/brief.py
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_ADMIN_TOPIC: ${{ secrets.NTFY_ADMIN_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_URL: ${{ vars.APP_URL }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Commit new cards
        id: commit
        run: |
          git config user.name "intel60-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cards.json pipeline/state.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update cards"
            git pull --rebase -X theirs origin main   # on a clash, keep this run's newer cards
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true' || (github.event_name != 'schedule' && inputs.source != 'timer')
        with:
          path: docs

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true' || (github.event_name != 'schedule' && inputs.source != 'timer')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  health:
    # Alerts the owner (NTFY_ADMIN_TOPIC) on the first failed run, and again when runs recover
    needs: [update, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report failures and recoveries
        env:
          GH_TOKEN: ${{ github.token }}
          ADMIN_TOPIC: ${{ secrets.NTFY_ADMIN_TOPIC }}
          FAILED: ${{ contains(fromJSON('["failure","cancelled"]'), needs.update.result) || contains(fromJSON('["failure","cancelled"]'), needs.deploy.result) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$ADMIN_TOPIC" ]; then echo "NTFY_ADMIN_TOPIC not set"; exit 0; fi
          prev=$(gh run list -R "$GITHUB_REPOSITORY" --workflow update.yml --status completed -L 1 --json conclusion --jq '.[0].conclusion // ""')
          echo "this run failed: $FAILED, previous run: $prev"
          if [ "$FAILED" = true ] && [ "$prev" != failure ]; then
            curl -s -H "Title: Intel60: update failed" -H "Priority: 4" -H "Tags: rotating_light" -H "Click: $RUN_URL"               -d "A run failed (update: ${{ needs.update.result }}, deploy: ${{ needs.deploy.result }}). Tap to open the log. You will get another alert when it recovers."               "https://ntfy.sh/$ADMIN_TOPIC"
          elif [ "$FAILED" != true ] && [ "$prev" = failure ]; then
            curl -s -H "Title: Intel60: updates recovered" -H "Tags: white_check_mark" -H "Click: $RUN_URL"               -d "Runs are succeeding again." "https://ntfy.sh/$ADMIN_TOPIC"
          fi
