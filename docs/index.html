<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CyberBrief</title>
<meta name="description" content="Cybersecurity news in 60 words">
<meta name="theme-color" content="#E7ECF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F161F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CyberBrief">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #E7ECF0;
  --card: #F8FAFB;
  --ink: #17212B;
  --muted: #586572;
  --rule: #CBD3DB;
  --critical: #C8102E;
  --high: #B86E00;
  --info: #3D6A99;
  --on-sev: #FFFFFF;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0F161F;
    --card: #18222D;
    --ink: #E5EAEF;
    --muted: #94A2AF;
    --rule: #2B3746;
    --critical: #F04A5E;
    --high: #F0A22B;
    --info: #74A3D8;
    --on-sev: #0F161F;
  }
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.app {
  height: 100%;
  max-width: 36rem;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

/* top bar */
.top { display: flex; align-items: baseline; gap: 1rem; padding: 0.875rem 1rem 0.625rem; }
.brand {
  background: none; border: 0; padding: 0;
  font-size: 1.375rem; font-weight: 800; font-variation-settings: "wdth" 70;
  letter-spacing: -0.01em;
}
.updated { margin-left: auto; font-size: 0.8125rem; color: var(--muted); }

.filters {
  display: flex; gap: 0.5rem; overflow-x: auto; scrollbar-width: none;
  padding: 0 1rem 0.75rem;
}
.filters::-webkit-scrollbar { display: none; }
.filters button {
  flex: none; font-size: 0.875rem; padding: 0.375rem 0.875rem;
  border-radius: 999px; border: 1px solid var(--rule); background: transparent;
}
.filters button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }

/* card feed */
.feed {
  flex: 1; min-height: 0; overflow-y: auto;
  scroll-snap-type: y mandatory; overscroll-behavior: contain;
  scrollbar-width: none;
}
.feed::-webkit-scrollbar { display: none; }
.slot { height: 100%; padding: 0 0.75rem 0.75rem; scroll-snap-align: start; scroll-snap-stop: always; }

.card {
  --sev: var(--info);
  height: 100%;
  display: grid;
  grid-template-columns: 2.5rem 1fr;
  background: var(--card);
  border-radius: 16px;
  overflow: hidden;
}
.card[data-sev="critical"] { --sev: var(--critical); }
.card[data-sev="high"] { --sev: var(--high); }

.strip {
  background: var(--sev);
  color: var(--on-sev);
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  display: flex; align-items: center;
  padding: 1.25rem 0;
  font-size: 1.0625rem; font-weight: 750; font-variation-settings: "wdth" 80;
  letter-spacing: 0.02em;
}

.body { display: flex; flex-direction: column; min-height: 0; overflow-y: auto; padding: 1.25rem 1.25rem 1rem; scrollbar-width: none; }
.body::-webkit-scrollbar { display: none; }
.meta { display: flex; flex-wrap: wrap; gap: 0.25rem 0.875rem; font-size: 0.8125rem; color: var(--muted); }
.meta .new { color: var(--sev); font-weight: 700; }

.headline {
  margin: 1.125rem 0 1rem;
  font-size: clamp(1.625rem, 7.2vw, 2.375rem);
  line-height: 1.02;
  font-weight: 800;
  font-variation-settings: "wdth" 66;
  letter-spacing: -0.005em;
  text-wrap: balance;
}
.summary { font-size: 1.0625rem; line-height: 1.52; }

.tags { display: flex; flex-wrap: wrap; gap: 0.375rem; margin: 1rem 0 1.125rem; }
.tag {
  font-size: 0.75rem; font-weight: 600; padding: 0.25rem 0.5rem;
  border-radius: 6px; border: 1px solid var(--rule); color: var(--muted);
}
.tag.watch { border-color: var(--sev); color: var(--sev); }

.foot { margin-top: auto; padding-top: 0.875rem; flex: none; border-top: 1px solid var(--rule); font-size: 0.875rem; }
.source { color: var(--muted); line-height: 1.4; }
.source a { color: inherit; }
.read {
  display: inline-block; margin-top: 0.5rem; padding: 0.25rem 0;
  font-weight: 700; color: var(--ink);
  text-decoration: underline; text-decoration-thickness: 2px;
  text-decoration-color: var(--sev); text-underline-offset: 4px;
}

.status { display: flex; justify-content: space-between; padding: 0 1.25rem 0.625rem; font-size: 0.75rem; color: var(--muted); }

.empty { height: 100%; display: grid; place-content: center; gap: 0.75rem; padding: 2rem; text-align: center; color: var(--muted); }
.empty strong { color: var(--ink); font-size: 1.125rem; }
.empty button { justify-self: center; padding: 0.5rem 1.125rem; border-radius: 999px; border: 1px solid var(--ink); background: transparent; color: var(--ink); }

@media (max-height: 720px) {
  .headline { font-size: 1.5rem; margin: 0.75rem 0; }
  .summary { font-size: 0.9375rem; line-height: 1.45; }
  .body { padding: 1rem 1rem 0.75rem; }
}
@media (min-width: 40rem) { .top { padding-top: 1.5rem; } }
@media (prefers-reduced-motion: no-preference) { .feed { scroll-behavior: smooth; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="brand" id="brand" title="Back to the newest story">CyberBrief</button>
    <span class="updated" id="updated"></span>
  </header>
  <nav class="filters" id="filters" aria-label="Filter stories"></nav>
  <main class="feed" id="feed" tabindex="-1"></main>
  <footer class="status"><span id="position"></span><span id="cost"></span></footer>
</div>

<script>
const FILTERS = [
  ["all", "All"], ["critical", "Critical"], ["Vulnerability", "Vulnerabilities"],
  ["Breach", "Breaches"], ["Ransomware", "Ransomware"], ["Malware", "Malware"],
  ["Threat actor", "Threat actors"], ["Policy", "Policy"], ["Research", "Research"],
];
const SEV_LABEL = { critical: "Critical", high: "High", info: "Info" };
const LAST_SEEN_KEY = "cyberbrief:lastSeen";

const $ = (id) => document.getElementById(id);
const feed = $("feed");
let data = { cards: [] };
let filter = "all";
let loadedAt = 0;
let lastSeen = "";
try { lastSeen = localStorage.getItem(LAST_SEEN_KEY) || ""; } catch {}

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function ago(isoStr) {
  if (!isoStr) return "";
  const mins = Math.max(0, Math.round((Date.now() - new Date(isoStr)) / 60000));
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins} min ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `${hrs} hr ago`;
  const days = Math.round(hrs / 24);
  return days === 1 ? "yesterday" : `${days} days ago`;
}

function renderFilters() {
  $("filters").innerHTML = FILTERS.map(([key, label]) =>
    `<button data-filter="${esc(key)}" aria-pressed="${key === filter}">${esc(label)}</button>`).join("");
}

function visibleCards() {
  if (filter === "all") return data.cards;
  if (filter === "critical") return data.cards.filter((c) => c.severity === "critical");
  return data.cards.filter((c) => c.category === filter);
}

function cardHTML(c) {
  const isNew = lastSeen && c.added > lastSeen;
  const tags = [
    ...(c.watch || []).map((w) => `<span class="tag watch">Watchlist: ${esc(w)}</span>`),
    ...(c.cves || []).map((v) => `<span class="tag">${esc(v)}</span>`),
  ].join("");
  const also = (c.also || []).map((a) => `<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.source)}</a>`).join(", ");
  return `
  <section class="slot" id="${esc(c.id)}">
    <article class="card" data-sev="${esc(c.severity)}">
      <div class="strip" aria-label="Severity">${esc(SEV_LABEL[c.severity] || "Info")}</div>
      <div class="body">
        <div class="meta">
          ${isNew ? '<span class="new">New</span>' : ""}
          <span>${esc(c.category)}</span>
          <time datetime="${esc(c.published)}">${esc(ago(c.published))}</time>
        </div>
        <h2 class="headline">${esc(c.headline)}</h2>
        <p class="summary">${esc(c.summary)}</p>
        ${tags ? `<div class="tags">${tags}</div>` : ""}
        <div class="foot">
          <div class="source">${esc(c.source)}${also ? `, also covered by ${also}` : ""}</div>
          <a class="read" href="${esc(c.url)}" target="_blank" rel="noopener">Read the full story</a>
        </div>
      </div>
    </article>
  </section>`;
}

function emptyHTML(title, text, action) {
  return `<div class="empty"><strong>${esc(title)}</strong><span>${esc(text)}</span>${action || ""}</div>`;
}

let observer;
function renderFeed() {
  const list = visibleCards();
  if (!data.cards.length) {
    feed.innerHTML = emptyHTML("No stories yet",
      "The first update runs within 30 minutes of setup. To run it now, open your repo's Actions tab and choose Run workflow.",
      '<button data-action="reload">Check again</button>');
  } else if (!list.length) {
    feed.innerHTML = emptyHTML("Nothing in this filter",
      "No stories from the last two weeks match. Choose All to see everything.",
      '<button data-filter="all">Show all stories</button>');
  } else {
    feed.innerHTML = list.map(cardHTML).join("");
  }
  feed.scrollTop = 0;
  setPosition(list.length ? 1 : 0, list.length);

  observer?.disconnect();
  observer = new IntersectionObserver((entries) => {
    for (const e of entries) if (e.isIntersecting) {
      setPosition([...feed.children].indexOf(e.target) + 1, list.length);
    }
  }, { root: feed, threshold: 0.6 });
  feed.querySelectorAll(".slot").forEach((s) => observer.observe(s));
}

function setPosition(n, total) {
  $("position").textContent = total ? `${n} of ${total}` : "";
}

function renderMeta() {
  $("updated").textContent = data.updated ? `Updated ${ago(data.updated)}` : "";
  $("cost").textContent = data.month_cost_usd
    ? `$${Number(data.month_cost_usd).toFixed(2)} this month`
    : data.ai_calls_month ? `Free tier, ${data.ai_calls_month} AI calls this month` : "";
}

async function load() {
  try {
    const res = await fetch(`cards.json?t=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
    data.cards = data.cards || [];
    loadedAt = Date.now();
  } catch {
    if (!data.cards.length) {
      feed.innerHTML = emptyHTML("Stories didn't load",
        "Your phone looks offline or the site is unreachable. Check your connection, then try again.",
        '<button data-action="reload">Try again</button>');
      return;
    }
  }
  renderMeta();
  renderFeed();
  jumpToHash();
}

function jumpToHash() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (!id) return;
  if (!document.getElementById(id) && filter !== "all") { filter = "all"; renderFilters(); renderFeed(); }
  document.getElementById(id)?.scrollIntoView({ block: "start" });
}

function markSeen() {
  const newest = data.cards.reduce((m, c) => (c.added > m ? c.added : m), "");
  if (newest) try { localStorage.setItem(LAST_SEEN_KEY, newest); } catch {}
}

document.addEventListener("click", (e) => {
  const f = e.target.closest("[data-filter]");
  if (f) { filter = f.dataset.filter; renderFilters(); renderFeed(); return; }
  if (e.target.closest("[data-action=reload]")) load();
});
$("brand").addEventListener("click", () => { feed.scrollTo({ top: 0 }); load(); });
window.addEventListener("hashchange", jumpToHash);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") markSeen();
  else if (Date.now() - loadedAt > 5 * 60000) load();
});
document.addEventListener("keydown", (e) => {
  const step = { ArrowDown: 1, j: 1, ArrowUp: -1, k: -1 }[e.key];
  if (!step) return;
  e.preventDefault();
  feed.scrollBy({ top: step * feed.clientHeight });
});
setInterval(renderMeta, 60000);

renderFilters();
load();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
